<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Swipe session {{ session_id }}</title>
<style>
:root { --bg: #0b0b0d; --fg: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --like: #10b981; --pass: #ef4444; --super: #fbbf24; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); min-height: 44px; }
header .who { font-weight: 600; font-size: 1.05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header .meta { color: var(--muted); white-space: nowrap; }
header .spacer { flex: 1; }
header .count { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.act { font-size: 0.75em; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--line); text-transform: uppercase; letter-spacing: 0.04em; }
.act-like { color: var(--like); border-color: rgba(16,185,129,.5); }
.act-pass { color: var(--pass); border-color: rgba(239,68,68,.5); }
.act-super-like { color: var(--super); border-color: rgba(251,191,36,.5); }
main { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: pan-y pinch-zoom; user-select: none; }
main img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.nav { position: absolute; top: 0; bottom: 0; width: 22%; border: 0; background: transparent; color: var(--fg); font-size: 34px; cursor: pointer; opacity: .55; }
.nav:hover { opacity: 1; }
.nav:disabled { opacity: .12; cursor: default; }
.prev { left: 0; text-align: left; padding-left: 12px; }
.next { right: 0; text-align: right; padding-right: 12px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); scrollbar-width: thin; }
.strip button { flex: 0 0 auto; padding: 0; border: 2px solid transparent; border-radius: 6px; background: none; cursor: pointer; position: relative; }
.strip button.on { border-color: var(--fg); }
.strip img { width: 56px; height: 84px; object-fit: cover; object-position: top; border-radius: 4px; display: block; }
.strip span { color: var(--fg); position: absolute; left: 2px; right: 2px; bottom: 2px; font-size: 10px; background: rgba(0,0,0,.65); border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.empty { margin: auto; color: var(--muted); }
</style>
</head>
<body>
{% if items %}
<header>
  <span class="who" id="who"></span>
  <span class="meta" id="meta"></span>
  <span class="act" id="act"></span>
  <span class="spacer"></span>
  <span class="count" id="count"></span>
</header>
<main id="stage">
  <img id="shot" alt="">
  <button class="nav prev" id="prev" aria-label="Previous">&#8249;</button>
  <button class="nav next" id="next" aria-label="Next">&#8250;</button>
</main>
<nav class="strip" id="strip">
  {% for it in items %}
  <button data-i="{{ loop.index0 }}" title="{{ it.name }}{% if it.age %}, {{ it.age }}{% endif %}">
    <img loading="lazy" src="{{ session_id }}/img/{{ it.file | urlencode }}" alt="">
    <span>{{ it.name }}{% if it.age %} {{ it.age }}{% endif %}</span>
  </button>
  {% endfor %}
</nav>
<script>
(() => {
  const items = {{ items | tojson }};
  const base = {{ session_id | tojson }} + "/img/";
  const $ = (id) => document.getElementById(id);
  const thumbs = [...document.querySelectorAll("#strip button")];
  let i = Math.min(Math.max(parseInt(location.hash.slice(1), 10) - 1 || 0, 0), items.length - 1);
  const src = (k) => base + encodeURIComponent(items[k].file);

  function show(k) {
    i = Math.min(Math.max(k, 0), items.length - 1);
    const it = items[i];
    $("shot").src = src(i);
    $("shot").alt = it.name;
    $("who").textContent = it.name + (it.age ? ", " + it.age : "");
    $("meta").textContent = it.platform;
    $("act").textContent = it.action;
    $("act").className = "act" + (it.action ? " act-" + it.action : "");
    $("act").hidden = !it.action;
    $("count").textContent = (i + 1) + " / " + items.length;
    $("prev").disabled = i === 0;
    $("next").disabled = i === items.length - 1;
    thumbs.forEach((t, n) => t.classList.toggle("on", n === i));
    thumbs[i].scrollIntoView({ block: "nearest", inline: "center" });
    history.replaceState(null, "", "#" + (i + 1));
    [i - 1, i + 1].forEach((n) => { if (n >= 0 && n < items.length) new Image().src = src(n); });
  }

  $("prev").onclick = () => show(i - 1);
  $("next").onclick = () => show(i + 1);
  thumbs.forEach((t) => t.onclick = () => show(+t.dataset.i));
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { show(i - 1); e.preventDefault(); }
    else if (e.key === "ArrowRight" || e.key === " ") { show(i + 1); e.preventDefault(); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(items.length - 1);
  });

  let x0 = null, y0 = null;
  const stage = $("stage");
  stage.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  stage.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) show(dx < 0 ? i + 1 : i - 1);
  }, { passive: true });

  show(i);
})();
</script>
{% else %}
<p class="empty">No screenshots in session {{ session_id }}.</p>
{% endif %}
</body>
</html>
